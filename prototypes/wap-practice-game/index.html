<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Packet Quest</title><link rel="icon" href="data:,"><style>
:root{color-scheme:dark;--ink:#f8fafc;--bg:#0b1020;--panel:#111827;--line:#475569;--red:#f87171;--green:#4ade80;--amber:#fbbf24;--cyan:#22d3ee;font-family:"Courier New",ui-monospace,monospace}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);max-width:100%}body{padding:10px 10px 28px;overflow-x:hidden;line-height:1.35}
button{min-height:44px;min-width:44px;border:3px solid var(--ink);border-radius:0;background:#1e293b;color:inherit;font:700 15px/1.2 "Courier New",monospace;padding:6px 10px;cursor:pointer;box-shadow:0 4px 0 #000}
button:not(.node):active{transform:translateY(3px);box-shadow:0 1px 0 #000}.node{box-shadow:0 4px 0 #000}button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible{outline:4px solid var(--amber);outline-offset:3px}button[aria-pressed=true].tool{background:var(--amber);color:#111}
header,main,footer{max-width:1100px;margin:0 auto}h1,h2{margin:.2em 0}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}.hud{display:flex;flex-wrap:wrap;gap:6px 14px;font-weight:700}.hud span{white-space:nowrap}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.mission{border:3px solid var(--cyan);background:#082f3a;padding:8px 12px;margin:8px 0}.mission p{margin:2px 0}
#goals{margin:4px 0 0;padding:0;list-style:none}#goals li{padding:2px 0}
.tip{border-left:6px solid var(--amber);padding:4px 10px;background:#1f1a08;margin:6px 0}
.map{position:relative;width:100%;aspect-ratio:2/1;min-height:300px;border:4px solid var(--line);background:repeating-linear-gradient(90deg,#0a1226 0 31px,#0f1b36 31px 32px),repeating-linear-gradient(#0a1226 0 31px,#0f1b36 31px 32px);overflow:hidden}
.links{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.links line{stroke:#64748b;stroke-width:3;vector-effect:non-scaling-stroke;stroke-dasharray:8 6}
.links line.route{stroke:var(--amber);stroke-dasharray:none;stroke-width:5}
.links line.dnslink{stroke:var(--cyan);stroke-dasharray:3 6}.links line.broken{stroke:var(--red);stroke-dasharray:2 14}
.tag{position:absolute;z-index:2;transform:translate(-50%,-50%);font-size:12px;font-weight:700;background:#0b1020;border:2px solid currentColor;padding:1px 5px;pointer-events:none;white-space:nowrap}
.tag.bad{color:var(--red)}.tag.dns{color:var(--cyan)}
.node{position:absolute;z-index:3;transform:translate(-50%,-50%);width:112px;min-height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:#172033;font-size:13px;padding:4px}
.node[hidden]{display:none}
.node svg{width:28px;height:28px;shape-rendering:crispEdges}.node .st{font-size:12px}
.node[data-state=fault]{border:4px dashed var(--red);background:#3b0d0d;animation:glitch .5s steps(2) infinite}
.node[data-state=ok]{border-color:var(--green)}.node.onroute{box-shadow:0 0 0 4px var(--amber)}
@keyframes glitch{0%{transform:translate(-50%,-50%)}50%{transform:translate(calc(-50% + 3px),calc(-50% - 2px))}100%{transform:translate(calc(-50% - 3px),calc(-50% + 2px))}}
.packet{position:absolute;z-index:4;transform:translate(-50%,-50%);margin-top:-52px;min-width:46px;height:28px;background:var(--amber);color:#111;font-weight:700;display:grid;place-items:center;border:3px solid #000;font-size:12px;padding:0 4px;transition:left .5s linear,top .5s linear;pointer-events:none}
.packet.shake{animation:glitch .2s steps(2) 3}
.screen{position:fixed;inset:0;background:rgba(2,6,23,.95);display:grid;place-items:center;padding:12px;text-align:center;z-index:10;overflow:auto}
.panel{width:min(640px,100%);background:var(--panel);border:4px solid var(--ink);padding:16px}.stars{font-size:28px;letter-spacing:4px;color:var(--amber)}
.hidden{display:none!important}.list{display:flex;flex-direction:column;gap:8px;margin:12px 0}.list button{text-align:left}
pre{white-space:pre-wrap;background:#020617;padding:10px;max-height:200px;overflow:auto;border:2px solid var(--line);margin:4px 0}
#learned{font-weight:700;color:var(--green)}.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
@media(max-width:640px){.map{aspect-ratio:7/9;min-height:0}.node{width:84px;min-height:64px;font-size:11px}.node svg{width:22px;height:22px}.tag{font-size:10px}.packet{margin-top:-42px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header class="top"><div><strong>PACKET QUEST</strong> <span id="stageName"></span></div>
<div class="hud" aria-label="Game status"><span id="lives"></span><span id="score"></span><span id="stars"></span></div>
<div class="controls"><button id="pause" aria-pressed="false">Pause (P)</button><button id="mute" aria-pressed="false">Sound: off</button><button id="textMode" aria-pressed="false">Text mode (T)</button><button id="retry">Retry stage</button></div></header>
<main id="main">
<section class="mission" aria-label="Mission"><p id="brief"></p><p id="target"></p><ul id="goals"></ul></section>
<div class="controls" role="group" aria-label="Tools"><button class="tool" id="toolRoute" aria-pressed="true">Route tool</button><button class="tool" id="repair" aria-pressed="false">Wrench tool (W)</button><span id="probes" class="controls" role="group" aria-label="Packet type"></span><button id="launch">Launch packet (L)</button></div>
<p class="tip" id="tip" role="status"></p><p id="paused" class="tip hidden" role="status">PAUSED. Press P or Resume.</p>
<section class="map" id="map" aria-label="Network map"><svg class="links" id="links" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg><div id="tags"></div><div id="nodes"></div><div class="packet" id="packet" aria-hidden="true">PKT</div></section>
<section id="listMode" class="list hidden" aria-label="Text mode: devices"></section>
<section><h2>Evidence</h2><pre id="log" aria-live="polite" tabindex="0"></pre><p id="learned"></p></section></main>
<footer><small>Original practice game · fictional data · not course credit · keys: Tab, Enter, P, W, L, T</small></footer>
<div id="overlay" class="screen" role="dialog" aria-modal="true" aria-labelledby="overlayTitle"><div class="panel"><h1 id="overlayTitle">PACKET QUEST</h1><p class="stars" id="overlayStars" aria-hidden="true"></p><p id="overlayText"></p><div class="row" id="overlayBtns"></div></div></div>
<script type="module">
import {STAGES,fresh,act,stars,goals,loadSave,record,score} from './rules.mjs';
const key='packet-quest-v1';let save=loadSave(localStorage.getItem(key)||'');try{localStorage.setItem(key,JSON.stringify(save))}catch{}
let state=fresh(0),stage=0,sound=false,paused=false,busy=false,tool='route',reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,timer=null;
const $=id=>document.getElementById(id);
const DEV={client:'CLIENT',switch:'SWITCH',router:'ROUTER',dns:'DNS',server:'SERVER'};
const ICON={client:'<rect x="3" y="4" width="18" height="12" fill="#22d3ee"/><rect x="9" y="18" width="6" height="2" fill="#94a3b8"/>',switch:'<rect x="2" y="9" width="20" height="8" fill="#a78bfa"/><rect x="5" y="12" width="2" height="2" fill="#000"/><rect x="9" y="12" width="2" height="2" fill="#000"/><rect x="13" y="12" width="2" height="2" fill="#000"/><rect x="17" y="12" width="2" height="2" fill="#000"/>',router:'<rect x="3" y="12" width="18" height="7" fill="#fb923c"/><rect x="6" y="4" width="2" height="8" fill="#fb923c"/><rect x="16" y="4" width="2" height="8" fill="#fb923c"/>',dns:'<rect x="4" y="3" width="16" height="18" fill="#4ade80"/><rect x="7" y="7" width="10" height="2" fill="#000"/><rect x="7" y="12" width="10" height="2" fill="#000"/>',server:'<rect x="4" y="2" width="16" height="6" fill="#f472b6"/><rect x="4" y="10" width="16" height="6" fill="#f472b6"/><rect x="4" y="18" width="16" height="4" fill="#f472b6"/>'};
const POS={wide:{client:[12,72],switch:[34,50],router:[60,22],dns:[60,78],server:[87,50]},narrow:{client:[20,88],switch:[20,58],router:[72,58],dns:[72,88],server:[72,24]}};
const mq=matchMedia('(max-width:640px)');const pos=()=>mq.matches?POS.narrow:POS.wide;
const present=()=>stage===0?['client','switch','server']:['client','switch','router','dns','server'];
const LINKS=()=>stage===0?[['client','switch'],['switch','server']]:[['client','switch'],['switch','router'],['router','server'],['switch','dns','dns']];
const faulty=id=>(id==='dns'&&!state.dns)||(id==='router'&&!state.gateway)||(id==='server'&&!state.web)||(id==='switch'&&!state.cable);
const FAULTNOTE={dns:'DNS DOWN',router:'WRONG GATEWAY',server:'WEB DOWN',switch:'PORT UNPLUGGED'};
function build(){$('nodes').innerHTML=Object.keys(DEV).map(id=>`<button class="node" id="${id}" data-id="${id}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[id]}</svg><span>${DEV[id]}</span><span class="st"></span></button>`).join('');
 $('nodes').addEventListener('click',e=>{const b=e.target.closest('.node');if(b)press(b.dataset.id)});
 $('listMode').addEventListener('click',e=>{const b=e.target.closest('[data-list]');if(b){const id=b.dataset.list;press(id);$('listMode').querySelector(`[data-list=${id}]`)?.focus()}});}
function layout(){const P=pos(),show=present();
 for(const id of Object.keys(DEV)){const n=$(id);n.hidden=!show.includes(id);n.style.left=P[id][0]+'%';n.style.top=P[id][1]+'%'}
 const route=state.route;let svg='',tags='';
 for(const [a,b,k] of LINKS()){const [x1,y1]=P[a],[x2,y2]=P[b];const idx=route.indexOf(b);const on=idx>0&&route[idx-1]===a;const broken=stage===0&&!state.cable&&a==='switch'&&b==='server';
  svg+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${on?'route':''} ${k==='dns'?'dnslink':''} ${broken?'broken':''}"/>`;
  const mx=(x1+x2)/2,my=(y1+y2)/2;if(broken)tags+=`<span class="tag bad" style="left:${mx}%;top:${my}%">✕ UNPLUGGED</span>`;if(k==='dns')tags+=`<span class="tag dns" style="left:${mx}%;top:${my}%">NAME LOOKUP ONLY</span>`}
 $('links').innerHTML=svg;$('tags').innerHTML=tags;if(!busy)placePacket('client');}
function placePacket(id){const p=pos()[id];$('packet').style.left=p[0]+'%';$('packet').style.top=p[1]+'%'}
const label=()=>({dns:'DNS?',page:'GET',ping:'PING'}[state.purpose]);
const hearts=()=>'♥'.repeat(Math.max(0,state.hp))+'♡'.repeat(Math.max(0,3-state.hp));
function nextHop(){const path=stage===0?['client','switch','server']:state.purpose==='dns'?['client','switch','dns']:['client','switch','router','server'];return state.route.length>=path.length?'LAUNCH':DEV[path[state.route.length]]}
function paint(){const spec=STAGES[stage];
 $('stageName').textContent=`· ${spec.title}`;$('brief').textContent=`${spec.name}: ${spec.brief}`;$('target').textContent=`Target ${spec.target}`;
 $('lives').textContent=`Lives ${hearts()} (${Math.max(0,state.hp)})`;$('score').textContent=`XP ${score(save)+(state.status==='win'?stars(state)*100:0)}`;
 const b=save.best[stage];$('stars').textContent=b?`Stage best ${'★'.repeat(b)}${'☆'.repeat(3-b)} (${b}/3)`:'Stage best: not cleared yet';
 $('goals').innerHTML=goals(state).map(g=>`<li>${g.done?'☑ DONE':'☐ TODO'}: ${g.text}</li>`).join('');
 $('tip').textContent=tool==='wrench'?'WRENCH tool: tap a device marked ⚠ to repair it. Tapping a non-repairable device costs a life.':`ROUTE tool: tap devices in path order, starting at CLIENT, then LAUNCH. Next: ${nextHop()}.`;
 $('toolRoute').setAttribute('aria-pressed',String(tool==='route'));$('repair').setAttribute('aria-pressed',String(tool==='wrench'));
 const pr=[['dns','DNS lookup'],['page','Page request'],['ping','Ping']].filter(([k])=>stage===0?k==='page':stage===1?k!=='ping':k!=='dns');
 $('probes').innerHTML=pr.map(([k,t])=>`<button class="tool" data-purpose="${k}" aria-pressed="${state.purpose===k}">${t}</button>`).join('');
 $('packet').textContent=label();
 for(const id of present()){const n=$(id),f=faulty(id),i=state.route.indexOf(id);n.dataset.state=f?'fault':'ok';n.classList.toggle('onroute',i>=0);n.querySelector('.st').textContent=`${f?'⚠ '+FAULTNOTE[id]:'✔ OK'}${i>=0?' | STEP '+(i+1):''}`;}
 $('listMode').innerHTML=present().map(id=>{const f=faulty(id),i=state.route.indexOf(id);return `<button data-list="${id}">${DEV[id]} — ${f?'⚠ '+FAULTNOTE[id]:'✔ OK'}${i>=0?' — route step '+(i+1):''}</button>`}).join('');
 const lines=[state.log.at(-1)||'No packet sent yet.'];if(save.evidence[stage].length)lines.push('--- Saved from your best clear ---',...save.evidence[stage]);$('log').textContent=lines.join('\n');
 $('learned').textContent=state.status==='win'?`What you learned: ${spec.learn}`:'';layout();}
function beep(i){if(!sound)return;try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.frequency.value=240+i*90;o.connect(g);g.connect(c.destination);g.gain.value=.03;o.start();o.stop(c.currentTime+.08)}catch{}}
function press(id){if(paused||busy||state.status!=='play')return;commit(act(state,tool==='wrench'?{type:'repair',node:id}:{type:'hop',node:id}))}
function overlay(title,text,starsN,btns){$('overlayTitle').textContent=title;$('overlayText').textContent=text;$('overlayStars').textContent=starsN==null?'':'★'.repeat(starsN)+'☆'.repeat(3-starsN)+` (${starsN}/3)`;
 $('overlayBtns').innerHTML=btns.map(([id,t])=>`<button id="${id}">${t}</button>`).join('');$('overlay').classList.remove('hidden');$('main').inert=true;document.querySelector('header').inert=true;$(btns[0][0]).focus();}
function closeOverlay(){$('overlay').classList.add('hidden');$('main').inert=false;document.querySelector('header').inert=false}
function commit(next){const was=state.status;state=next;paint();
 if(state.status==='win'&&was!=='win'){save=record(save,state);try{localStorage.setItem(key,JSON.stringify(save))}catch{}paint();overlay(stage===2?'BOSS CLEARED':'STAGE CLEAR',`+${stars(state)*100} XP. What you learned: ${STAGES[stage].learn}`,stars(state),[[stage<2?'next':'again',stage<2?'Next stage':'Play again'],['review','Review evidence']])}
 else if(state.status==='lose'&&was!=='lose')overlay('SIGNAL LOST','Out of lives. Retry is free; lives reset.',null,[['again','Retry stage'],['review','Review evidence']])}
function launch(){if(busy||paused||state.status!=='play')return;busy=true;$('launch').disabled=true;const before=structuredClone(state);const pts=[...before.route];let i=0;
 const finish=()=>{busy=false;$('launch').disabled=paused;commit(act(before,{type:'launch'}));placePacket('client')};
 if(!pts.length){$('packet').classList.add('shake');timer=setTimeout(()=>{$('packet').classList.remove('shake');finish()},reduced?0:600);return}
 const step=()=>{placePacket(pts[i]);beep(i);i++;timer=setTimeout(i<pts.length?step:finish,reduced?0:(i<pts.length?550:600))};step();}
function start(s){clearTimeout(timer);busy=false;$('launch').disabled=paused;stage=s;state=fresh(s);tool='route';closeOverlay();paint()}
$('overlayBtns').addEventListener('click',e=>{const id=e.target.id;if(/^s[012]$/.test(id))start(+id[1]);else if(id==='next')start(stage+1);else if(id==='again')start(state.status==='win'&&stage===2?0:stage);else if(id==='review'){closeOverlay();$('log').scrollIntoView({block:'center'});$('log').focus()}});
$('probes').addEventListener('click',e=>{const b=e.target.closest('[data-purpose]');if(b&&!busy&&!paused){const k=b.dataset.purpose;commit(act(state,{type:'purpose',value:k}));$('probes').querySelector(`[data-purpose=${k}]`)?.focus()}});
$('launch').onclick=launch;$('retry').onclick=()=>start(stage);
$('toolRoute').onclick=()=>{tool='route';paint()};$('repair').onclick=()=>{tool=tool==='wrench'?'route':'wrench';paint()};
$('pause').onclick=()=>{paused=!paused;$('pause').setAttribute('aria-pressed',String(paused));$('pause').textContent=paused?'Resume (P)':'Pause (P)';$('paused').classList.toggle('hidden',!paused);$('launch').disabled=paused||busy};
$('mute').onclick=()=>{sound=!sound;$('mute').textContent=sound?'Sound: on':'Sound: off';$('mute').setAttribute('aria-pressed',String(sound))};
$('textMode').onclick=()=>{const on=$('listMode').classList.toggle('hidden')===false;$('map').classList.toggle('hidden',on);$('textMode').setAttribute('aria-pressed',String(on))};
addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||!$('overlay').classList.contains('hidden'))return;const k=e.key.toLowerCase();
 if(k==='p')$('pause').click();else if(k==='w')$('repair').click();else if(k==='l')launch();else if(k==='t')$('textMode').click();else return;e.preventDefault()});
mq.addEventListener('change',layout);build();paint();
overlay('PACKET QUEST','Route the packet. Fix the glitch. Deliver the page. Pick a stage.',null,[['s0','Stage 1: Cross the LAN'],['s1','Stage 2: Name Rescue'],['s2','Stage 3: BOSS']]);
</script></body></html>
