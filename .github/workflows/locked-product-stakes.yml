name: Locked Product Stakes

on:
  pull_request:
    branches: [master]
    types: [opened, edited, synchronize, labeled, unlabeled, reopened]
  # Merge queue (WAP-201): the check must report on the queue commit when it is
  # a required check, or the queue waits forever. It already ran against the
  # PR (and re-runs on every label change), so on merge_group it passes.
  merge_group:

jobs:
  locked-stakes-check:
    name: Locked product stakes approval
    runs-on: ubuntu-latest
    steps:
      - name: Checkout for bypass script
        uses: actions/checkout@v4

      - name: Check locked files against approval label or i18n-only bypass
        uses: actions/github-script@v7
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const path = require('node:path');

            if (context.eventName === 'merge_group') {
              core.info('merge_group: this check already passed on the pull request; the queue commit adds no new PR files or labels to review.');
              return;
            }

            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed('This workflow only runs on pull_request events.');
              return;
            }

            const lockedPatterns = [
              'app/page.tsx',
              'app/(decision-journey)/programs/page.tsx',
              'app/(decision-journey)/programs/ProgramsContent.tsx',
              'lib/content/programSubgroup.ts',
              'app/(portal)/dashboard/program/page.tsx',
              'components/admin/MemberDetailActions.tsx',
              'app/api/admin/members/[id]/program/route.ts',
            ];

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const changed = files.map((file) => file.filename);
            const touchedLocked = changed.filter((file) => lockedPatterns.includes(file));

            if (touchedLocked.length === 0) {
              core.info('No locked product-stake files changed.');
              return;
            }

            const labels = (pr.labels || []).map((label) => label.name);
            const approved = labels.includes('stake-approved');

            // Path A: explicit approval label always wins.
            if (approved) {
              core.summary
                .addHeading('Locked Product Stakes Check')
                .addRaw(`Locked files touched:\n${touchedLocked.map((f) => `- ${f}`).join('\n')}\n\n`)
                .addRaw('Approval label `stake-approved` present — passing.\n')
                .write();
              return;
            }

            // Path B: i18n-only rewrap bypass. Conservatively verify that the
            // ONLY changes are wrapping existing English literals with t()
            // calls plus add-only entries to messages/*.json. If the script
            // says safe, we let the PR through; if not, we fall through to
            // requiring the label.
            const fileByName = new Map(files.map((f) => [f.filename, f]));

            const lockedPatches = {};
            for (const f of touchedLocked) {
              lockedPatches[f] = fileByName.get(f)?.patch ?? '';
            }

            const messagesRe = /^messages\/[^/]+\.json$/;
            const messagesPatches = {};
            for (const f of changed) {
              if (messagesRe.test(f)) {
                messagesPatches[f] = fileByName.get(f)?.patch ?? '';
              }
            }

            // Pull base + head messages/en.json to verify removed literals
            // match the new key values.
            async function loadJson(ref) {
              try {
                const res = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: 'messages/en.json',
                  ref,
                });
                if (Array.isArray(res.data) || !('content' in res.data)) return null;
                const buf = Buffer.from(res.data.content, res.data.encoding || 'base64');
                return JSON.parse(buf.toString('utf8'));
              } catch (e) {
                core.warning(`Could not load messages/en.json @ ${ref}: ${e.message}`);
                return null;
              }
            }

            const baseEn = await loadJson(pr.base.sha);
            const headEn = await loadJson(pr.head.sha);

            const input = JSON.stringify({
              lockedPatterns,
              changedFiles: changed,
              lockedPatches,
              messagesPatches,
              baseEn,
              headEn,
            });

            let result = { safe: false, reason: 'bypass script did not run' };
            try {
              const stdout = execFileSync(
                'node',
                [path.resolve('scripts/locked-stakes/check-i18n-safe-diff.mjs')],
                { input, encoding: 'utf8' },
              );
              result = JSON.parse(stdout);
            } catch (e) {
              core.warning(`i18n-bypass script failed: ${e.message}`);
            }

            core.summary
              .addHeading('Locked Product Stakes Check')
              .addRaw(`Locked files touched:\n${touchedLocked.map((f) => `- ${f}`).join('\n')}\n\n`)
              .addRaw(`Approval label \`stake-approved\` present: ${approved ? 'yes' : 'no'}\n\n`)
              .addRaw(`i18n-only bypass: ${result.safe ? 'PASSED' : 'not eligible'} — ${result.reason}\n`)
              .write();

            if (result.safe) {
              core.info(`Allowing without label: ${result.reason}`);
              return;
            }

            core.setFailed(
              `This PR changes locked WorkforceAP product-stake files. Add the \`stake-approved\` label after Mike explicitly approves the change. (i18n-only bypass not eligible: ${result.reason})`
            );
