name: Authenticated Portal Smoke

# WAP-204: nightly-ready, dispatch-only until WAP-66 lands (see `on:`). The
# preview policies first refresh the `preview` mirror to master and wait for
# Vercel to build it, because the SHA gate below refuses a stale target. Once
# scheduled, a scheduled run uses the default `isolated_preview` policy and a
# failure opens or refreshes one GitHub issue, "Nightly: Authenticated Portal
# Smoke failing" (nightly-failure-issue.yml). Not a PR check. See
# docs/SLO-AND-STATUS.md, "Nightly heavy suites".

on:
  # Schedule gated on WAP-66 (authenticated fresh preview): once it lands, add
  # `schedule: - cron: "37 7 * * *"` here (07:37 UTC, after the 06:17 RLS job).
  workflow_dispatch:
    inputs:
      audit_target:
        description: "Trusted target and coverage policy"
        required: true
        default: isolated_preview
        type: choice
        options:
          - isolated_preview
          - production_canary
          - hub_smoke
      capture_hydration_trace:
        description: "Log privacy-minimized root structure on hydration errors (isolated Preview only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# A scheduled run (once enabled) has no inputs; it runs the default isolated_preview policy.
concurrency:
  group: authenticated-portal-smoke-${{ inputs.audit_target || 'isolated_preview' }}
  cancel-in-progress: false

jobs:
  # The preview policies need `preview` to serve master's exact commit. The
  # mirror no-ops when it already does; otherwise Vercel builds one Preview.
  mirror:
    name: Refresh the preview mirror
    if: >-
      github.repository == 'workforceap/workforceap-beta' &&
      github.ref == 'refs/heads/master' &&
      (inputs.audit_target || 'isolated_preview') != 'production_canary'
    permissions:
      contents: write
    uses: ./.github/workflows/mirror-master-to-preview.yml

  smoke:
    name: Run trusted authenticated portal audit
    needs: mirror
    # Secrets are only exposed to the canonical repository's trusted master workflow.
    # Dispatching a feature-branch copy results in a skipped job.
    # `always()` so production_canary (mirror skipped) still runs; a failed
    # mirror stops the audit.
    if: >-
      always() &&
      github.repository == 'workforceap/workforceap-beta' && github.ref == 'refs/heads/master' &&
      (needs.mirror.result == 'success' || needs.mirror.result == 'skipped')
    runs-on: ubuntu-latest
    # Up to 25 minutes waiting for the Vercel Preview build, then the audit.
    timeout-minutes: 55
    permissions:
      contents: read
      deployments: read
    env:
      AUDIT_TARGET: ${{ inputs.audit_target || 'isolated_preview' }}
      PORTAL_AUDIT_MODE: ${{ inputs.audit_target == 'hub_smoke' && 'isolated_preview' || inputs.audit_target || 'isolated_preview' }}
      PORTAL_AUDIT_SECTION: all
      PORTAL_AUDIT_OUTPUT: test-results/portal-audit-results.json

    steps:
      - name: Checkout trusted master
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify trusted checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote="$(git remote get-url origin)"
          test "$remote" = "https://github.com/workforceap/workforceap-beta" || \
            test "$remote" = "https://github.com/workforceap/workforceap-beta.git"

      # Fail fast, with Vercel's own reason, when the Preview build of the
      # mirrored commit failed, instead of timing out in the SHA gate below.
      # A missing or still-building deployment is waited for (25 minutes).
      - name: Wait for the Vercel Preview build of this commit
        if: env.AUDIT_TARGET != 'production_canary'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 1500 ))
          while :; do
            dep="$(gh api "repos/${GITHUB_REPOSITORY}/deployments?sha=${GITHUB_SHA}&environment=Preview&per_page=20" \
              --jq '[.[] | select(.creator.login == "vercel[bot]")] | sort_by(.created_at) | last | .id // empty')"
            state=none
            if [ -n "$dep" ]; then
              state="$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${dep}/statuses?per_page=1" --jq '.[0].state // "none"')"
            fi
            echo "Vercel Preview deployment for ${GITHUB_SHA:0:9}: ${dep:-none} (${state})"
            case "$state" in
              success|inactive) break ;;
              failure|error)
                desc="$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${dep}/statuses?per_page=1" --jq '.[0].description // ""')"
                echo "::error::Vercel's Preview build of ${GITHUB_SHA:0:9} on the preview branch failed (deployment ${dep}): ${desc}. The Preview environment for the preview branch must build before this audit can run."
                exit 1 ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::No successful Vercel Preview deployment of ${GITHUB_SHA:0:9} after 25 minutes. Check that vercel.json's ignoreCommand still builds the preview branch."
              exit 1
            fi
            sleep 20
          done

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Prove the target before any credentialed step: it must serve the exact
      # commit checked out above and be wired to the Supabase project this policy
      # allows (the DEMO project for isolated_preview / hub_smoke, the real one for
      # production_canary). A preview that is still building is retried for up
      # to ten minutes; the wrong database fails at once. The origin is never
      # written to the log.
      - name: Verify deployed target matches trusted SHA and Supabase scope
        id: verify
        shell: bash
        env:
          PORTAL_AUDIT_TARGET_ORIGIN: ${{ env.AUDIT_TARGET == 'production_canary' && 'https://www.workforceap.org' || secrets.PREVIEW_SITE_URL }}
          PORTAL_AUDIT_TRUSTED_PREVIEW_ORIGIN: ${{ env.AUDIT_TARGET != 'production_canary' && secrets.PREVIEW_SITE_URL || '' }}
          PORTAL_AUDIT_TRUSTED_SHA: ${{ github.sha }}
        run: node scripts/portal-audit-health-gate.mjs

      - name: Run narrow member/counselor/employer hub smoke
        if: env.AUDIT_TARGET == 'hub_smoke'
        run: pnpm test:e2e:portal-hubs
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.PREVIEW_SITE_URL }}
          E2E_MEMBER_EMAIL: ${{ secrets.PREVIEW_E2E_MEMBER_EMAIL }}
          E2E_MEMBER_PASSWORD: ${{ secrets.PREVIEW_E2E_MEMBER_PASSWORD }}
          E2E_COUNSELOR_EMAIL: ${{ secrets.PREVIEW_E2E_COUNSELOR_EMAIL }}
          E2E_COUNSELOR_PASSWORD: ${{ secrets.PREVIEW_E2E_COUNSELOR_PASSWORD }}
          E2E_EMPLOYER_EMAIL: ${{ secrets.PREVIEW_E2E_EMPLOYER_EMAIL }}
          E2E_EMPLOYER_PASSWORD: ${{ secrets.PREVIEW_E2E_EMPLOYER_PASSWORD }}

      - name: Run full five-role isolated preview audit
        if: env.AUDIT_TARGET == 'isolated_preview'
        run: pnpm audit:portal
        env:
          PORTAL_AUDIT_HYDRATION_TRACE: ${{ inputs.capture_hydration_trace && '1' || '0' }}
          PORTAL_AUDIT_TRUSTED_PREVIEW_ORIGIN: ${{ secrets.PREVIEW_SITE_URL }}
          PLAYWRIGHT_BASE_URL: ${{ secrets.PREVIEW_SITE_URL }}
          E2E_MEMBER_EMAIL: ${{ secrets.PREVIEW_E2E_MEMBER_EMAIL }}
          E2E_MEMBER_PASSWORD: ${{ secrets.PREVIEW_E2E_MEMBER_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.PREVIEW_E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.PREVIEW_E2E_ADMIN_PASSWORD }}
          E2E_EMPLOYER_EMAIL: ${{ secrets.PREVIEW_E2E_EMPLOYER_EMAIL }}
          E2E_EMPLOYER_PASSWORD: ${{ secrets.PREVIEW_E2E_EMPLOYER_PASSWORD }}
          E2E_PARTNER_EMAIL: ${{ secrets.PREVIEW_E2E_PARTNER_EMAIL }}
          E2E_PARTNER_PASSWORD: ${{ secrets.PREVIEW_E2E_PARTNER_PASSWORD }}
          E2E_COUNSELOR_EMAIL: ${{ secrets.PREVIEW_E2E_COUNSELOR_EMAIL }}
          E2E_COUNSELOR_PASSWORD: ${{ secrets.PREVIEW_E2E_COUNSELOR_PASSWORD }}
          PORTAL_AUDIT_READ_ONLY_TOKEN: ${{ secrets.PREVIEW_PORTAL_AUDIT_READ_ONLY_TOKEN }}

      - name: Run non-staff production canary
        if: env.AUDIT_TARGET == 'production_canary'
        run: pnpm audit:portal
        env:
          PLAYWRIGHT_BASE_URL: https://www.workforceap.org
          E2E_MEMBER_EMAIL: ${{ secrets.E2E_MEMBER_EMAIL }}
          E2E_MEMBER_PASSWORD: ${{ secrets.E2E_MEMBER_PASSWORD }}
          E2E_EMPLOYER_EMAIL: ${{ secrets.E2E_EMPLOYER_EMAIL }}
          E2E_EMPLOYER_PASSWORD: ${{ secrets.E2E_EMPLOYER_PASSWORD }}
          E2E_PARTNER_EMAIL: ${{ secrets.E2E_PARTNER_EMAIL }}
          E2E_PARTNER_PASSWORD: ${{ secrets.E2E_PARTNER_PASSWORD }}
          PORTAL_AUDIT_READ_ONLY_TOKEN: ${{ secrets.PORTAL_AUDIT_READ_ONLY_TOKEN }}

      # Only after the gate passed: a gate failure produces no result file, and
      # `if-no-files-found: error` below must keep meaning "the audit ran but
      # wrote nothing", not "the target was never reached".
      # hub_smoke uses Playwright HTML/results instead of the audit JSON artifact.
      - name: Upload current audit artifact
        if: always() && steps.verify.outcome == 'success' && env.AUDIT_TARGET != 'hub_smoke'
        uses: actions/upload-artifact@v4
        with:
          name: portal-audit-results-${{ env.AUDIT_TARGET }}-${{ github.run_id }}
          path: test-results/portal-audit-results.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload hub smoke Playwright report
        if: always() && steps.verify.outcome == 'success' && env.AUDIT_TARGET == 'hub_smoke'
        uses: actions/upload-artifact@v4
        with:
          name: portal-hub-smoke-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  # WAP-204: a failed *scheduled* run opens (or comments on) one issue.
  # Inert until the schedule is enabled (WAP-66); dispatches never report.
  report:
    name: Nightly failure issue
    needs: [mirror, smoke]
    if: always() && github.event_name == 'schedule' && github.repository == 'workforceap/workforceap-beta'
    permissions:
      issues: write
    uses: ./.github/workflows/nightly-failure-issue.yml
    with:
      suite: Authenticated Portal Smoke
      result: ${{ contains(needs.*.result, 'failure') && 'failure' || needs.smoke.result }}
      detail: ${{ needs.mirror.result == 'failure' && 'refreshing the preview mirror failed' || '' }}
