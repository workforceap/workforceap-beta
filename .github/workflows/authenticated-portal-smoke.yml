name: Authenticated Portal Smoke

on:
  workflow_dispatch:
    inputs:
      audit_target:
        description: "Trusted target and coverage policy"
        required: true
        default: isolated_preview
        type: choice
        options:
          - isolated_preview
          - production_canary
          - hub_smoke

permissions:
  contents: read

concurrency:
  group: authenticated-portal-smoke-${{ inputs.audit_target }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Run trusted authenticated portal audit
    # Secrets are only exposed to the canonical repository's trusted master workflow.
    # Dispatching a feature-branch copy results in a skipped job.
    if: github.repository == 'workforceap/workforceap-beta' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PORTAL_AUDIT_MODE: ${{ inputs.audit_target == 'hub_smoke' && 'isolated_preview' || inputs.audit_target }}
      PORTAL_AUDIT_SECTION: all
      PORTAL_AUDIT_OUTPUT: test-results/portal-audit-results.json

    steps:
      - name: Checkout trusted master
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify trusted checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote="$(git remote get-url origin)"
          test "$remote" = "https://github.com/workforceap/workforceap-beta" || \
            test "$remote" = "https://github.com/workforceap/workforceap-beta.git"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Prove the target before any credentialed step: it must serve the exact
      # commit checked out above and be wired to the Supabase project this policy
      # allows (the DEMO project for isolated_preview / hub_smoke, the real one for
      # production_canary). A preview that is still building is retried for up
      # to ten minutes; the wrong database fails at once. The origin is never
      # written to the log.
      - name: Verify deployed target matches trusted SHA and Supabase scope
        id: verify
        shell: bash
        env:
          PORTAL_AUDIT_TARGET_ORIGIN: ${{ inputs.audit_target == 'production_canary' && 'https://www.workforceap.org' || secrets.PREVIEW_SITE_URL }}
          PORTAL_AUDIT_TRUSTED_PREVIEW_ORIGIN: ${{ inputs.audit_target != 'production_canary' && secrets.PREVIEW_SITE_URL || '' }}
          PORTAL_AUDIT_TRUSTED_SHA: ${{ github.sha }}
        run: node scripts/portal-audit-health-gate.mjs

      - name: Run narrow member/counselor/employer hub smoke
        if: inputs.audit_target == 'hub_smoke'
        run: pnpm test:e2e:portal-hubs
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.PREVIEW_SITE_URL }}
          E2E_MEMBER_EMAIL: ${{ secrets.E2E_MEMBER_EMAIL }}
          E2E_MEMBER_PASSWORD: ${{ secrets.E2E_MEMBER_PASSWORD }}
          E2E_COUNSELOR_EMAIL: ${{ secrets.E2E_COUNSELOR_EMAIL }}
          E2E_COUNSELOR_PASSWORD: ${{ secrets.E2E_COUNSELOR_PASSWORD }}
          E2E_EMPLOYER_EMAIL: ${{ secrets.E2E_EMPLOYER_EMAIL }}
          E2E_EMPLOYER_PASSWORD: ${{ secrets.E2E_EMPLOYER_PASSWORD }}

      - name: Run full five-role isolated preview audit
        if: inputs.audit_target == 'isolated_preview'
        run: pnpm audit:portal
        env:
          PORTAL_AUDIT_TRUSTED_PREVIEW_ORIGIN: ${{ secrets.PREVIEW_SITE_URL }}
          PLAYWRIGHT_BASE_URL: ${{ secrets.PREVIEW_SITE_URL }}
          E2E_MEMBER_EMAIL: ${{ secrets.E2E_MEMBER_EMAIL }}
          E2E_MEMBER_PASSWORD: ${{ secrets.E2E_MEMBER_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_EMPLOYER_EMAIL: ${{ secrets.E2E_EMPLOYER_EMAIL }}
          E2E_EMPLOYER_PASSWORD: ${{ secrets.E2E_EMPLOYER_PASSWORD }}
          E2E_PARTNER_EMAIL: ${{ secrets.E2E_PARTNER_EMAIL }}
          E2E_PARTNER_PASSWORD: ${{ secrets.E2E_PARTNER_PASSWORD }}
          E2E_COUNSELOR_EMAIL: ${{ secrets.E2E_COUNSELOR_EMAIL }}
          E2E_COUNSELOR_PASSWORD: ${{ secrets.E2E_COUNSELOR_PASSWORD }}
          PORTAL_AUDIT_READ_ONLY_TOKEN: ${{ secrets.PORTAL_AUDIT_READ_ONLY_TOKEN }}

      - name: Run non-staff production canary
        if: inputs.audit_target == 'production_canary'
        run: pnpm audit:portal
        env:
          PLAYWRIGHT_BASE_URL: https://www.workforceap.org
          E2E_MEMBER_EMAIL: ${{ secrets.E2E_MEMBER_EMAIL }}
          E2E_MEMBER_PASSWORD: ${{ secrets.E2E_MEMBER_PASSWORD }}
          E2E_EMPLOYER_EMAIL: ${{ secrets.E2E_EMPLOYER_EMAIL }}
          E2E_EMPLOYER_PASSWORD: ${{ secrets.E2E_EMPLOYER_PASSWORD }}
          E2E_PARTNER_EMAIL: ${{ secrets.E2E_PARTNER_EMAIL }}
          E2E_PARTNER_PASSWORD: ${{ secrets.E2E_PARTNER_PASSWORD }}
          PORTAL_AUDIT_READ_ONLY_TOKEN: ${{ secrets.PORTAL_AUDIT_READ_ONLY_TOKEN }}

      # Only after the gate passed: a gate failure produces no result file, and
      # `if-no-files-found: error` below must keep meaning "the audit ran but
      # wrote nothing", not "the target was never reached".
      # hub_smoke uses Playwright HTML/results instead of the audit JSON artifact.
      - name: Upload current audit artifact
        if: always() && steps.verify.outcome == 'success' && inputs.audit_target != 'hub_smoke'
        uses: actions/upload-artifact@v4
        with:
          name: portal-audit-results-${{ inputs.audit_target }}-${{ github.run_id }}
          path: test-results/portal-audit-results.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload hub smoke Playwright report
        if: always() && steps.verify.outcome == 'success' && inputs.audit_target == 'hub_smoke'
        uses: actions/upload-artifact@v4
        with:
          name: portal-hub-smoke-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
