name: Resume Build DEMO Acceptance

# Provider-backed acceptance of member Resume Build on the isolated DEMO
# Preview. Each run creates ONE disposable synthetic member
# (resume-qa-<run>-<attempt>@example.com), uploads a synthetic two-page PDF
# (facts on page 2), runs Build with the real provider, checks the saved draft,
# and always removes that member by its recorded ID. Runbook, prerequisites
# and cleanup verification: docs/RESUME-DEMO-ACCEPTANCE.md.
#
# It writes to the DEMO project and spends provider quota, so it is separate
# from the read-only Authenticated Portal Smoke, has no schedule and no
# pull_request trigger, and runs only on manual dispatch from trusted master.
# It never targets production: gate 1 proves the PREVIEW_SITE_URL deployment
# serves this exact commit on the DEMO Supabase project before any credential
# is read, and gate 2 (inside the helper) refuses Supabase or database URLs
# that are not the DEMO project and any organization that is not the exact
# active portal-qa-* fixture organization.
#
# STOP before dispatching: DEMO_SETUP.md:65 documents the Preview GROQ_API_KEY
# as the production key, so a run spends production Groq quota. Dispatch only
# with Mike's explicit OK (docs/RESUME-DEMO-ACCEPTANCE.md, "Dispatch").

on:
  workflow_dispatch:
    inputs:
      qa_organization_id:
        description: "Exact ID of the dedicated portal-qa-* organization in the DEMO project"
        required: true
        type: string
      qa_organization_slug:
        description: "Its slug (must start with portal-qa-)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: resume-demo-acceptance
  cancel-in-progress: false

jobs:
  # Same mirror the portal smoke uses: `preview` must serve master's commit.
  mirror:
    name: Refresh the preview mirror
    if: github.repository == 'workforceap/workforceap-beta' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    uses: ./.github/workflows/mirror-master-to-preview.yml

  acceptance:
    name: Upload and Build as a disposable DEMO member
    needs: mirror
    if: >-
      !cancelled() && needs.mirror.result == 'success' &&
      github.repository == 'workforceap/workforceap-beta' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      deployments: read
    env:
      # Outside the workspace, so no artifact step can pick it up.
      RESUME_QA_STATE_FILE: /tmp/resume-qa-fixture.json

    steps:
      - name: Checkout trusted master
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify trusted checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote="$(git remote get-url origin)"
          test "$remote" = "https://github.com/workforceap/workforceap-beta" || \
            test "$remote" = "https://github.com/workforceap/workforceap-beta.git"

      - name: Wait for the Vercel Preview build of this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 1500 ))
          while :; do
            dep="$(gh api "repos/${GITHUB_REPOSITORY}/deployments?sha=${GITHUB_SHA}&environment=Preview&per_page=20" \
              --jq '[.[] | select(.creator.login == "vercel[bot]")] | sort_by(.created_at) | last | .id // empty')"
            state=none
            if [ -n "$dep" ]; then
              state="$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${dep}/statuses?per_page=1" --jq '.[0].state // "none"')"
            fi
            echo "Vercel Preview deployment for ${GITHUB_SHA:0:9}: ${dep:-none} (${state})"
            case "$state" in
              success|inactive) break ;;
              failure|error) echo "::error::Vercel's Preview build of ${GITHUB_SHA:0:9} failed (deployment ${dep})."; exit 1 ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::No successful Vercel Preview deployment of ${GITHUB_SHA:0:9} after 25 minutes."
              exit 1
            fi
            sleep 20
          done

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Gate 1, before any credential: the Preview serves this exact commit and
      # its /api/health reports the DEMO Supabase project (isolated_preview).
      - name: Verify Preview SHA and DEMO Supabase scope
        shell: bash
        env:
          PORTAL_AUDIT_MODE: isolated_preview
          PORTAL_AUDIT_TARGET_ORIGIN: ${{ secrets.PREVIEW_SITE_URL }}
          PORTAL_AUDIT_TRUSTED_PREVIEW_ORIGIN: ${{ secrets.PREVIEW_SITE_URL }}
          PORTAL_AUDIT_TRUSTED_SHA: ${{ github.sha }}
        run: node scripts/portal-audit-health-gate.mjs

      # Gate 2 runs inside the helper before any client exists: the Supabase URL
      # and database URL must both identify the DEMO project, and the
      # organization must be the exact, active portal-qa-* fixture organization
      # (scripts/lib/portal-qa-guard.cjs). It fails closed otherwise.
      - name: Create the disposable synthetic member
        id: create
        env:
          PORTAL_QA_TARGET: demo
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PREVIEW_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PREVIEW_SUPABASE_SERVICE_ROLE_KEY }}
          POSTGRES_PRISMA_URL: ${{ secrets.PREVIEW_POSTGRES_PRISMA_URL }}
          PORTAL_QA_ORGANIZATION_ID: ${{ inputs.qa_organization_id }}
          PORTAL_QA_ORGANIZATION_SLUG: ${{ inputs.qa_organization_slug }}
        run: pnpm exec tsx scripts/resume-demo-member.ts create

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the acceptance spec
        run: pnpm exec playwright test tests/e2e/resume-demo-acceptance.spec.ts --project=chromium --retries=0 --reporter=list
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.PREVIEW_SITE_URL }}
          RESUME_ACCEPTANCE_SHARED_EMAILS: ${{ secrets.PREVIEW_E2E_MEMBER_EMAIL }}
          RESUME_ACCEPTANCE_CONFIRMED: "1"
          RESUME_ACCEPTANCE_OUTPUT: test-results/resume-demo-acceptance.json

      # Always runs once a member may exist: removes exactly the recorded ID.
      - name: Clean up the disposable synthetic member
        if: always() && steps.create.outcome != 'skipped'
        env:
          PORTAL_QA_TARGET: demo
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PREVIEW_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PREVIEW_SUPABASE_SERVICE_ROLE_KEY }}
          POSTGRES_PRISMA_URL: ${{ secrets.PREVIEW_POSTGRES_PRISMA_URL }}
          PORTAL_QA_ORGANIZATION_ID: ${{ inputs.qa_organization_id }}
          PORTAL_QA_ORGANIZATION_SLUG: ${{ inputs.qa_organization_slug }}
          RESUME_QA_CLEANUP_OUTPUT: test-results/resume-demo-cleanup.json
        run: pnpm exec tsx scripts/resume-demo-member.ts cleanup

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resume-demo-acceptance-${{ github.run_id }}
          path: |
            test-results/resume-demo-acceptance.json
            test-results/resume-demo-cleanup.json
          if-no-files-found: ignore
          retention-days: 14
