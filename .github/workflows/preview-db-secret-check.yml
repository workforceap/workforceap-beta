name: Preview DB Secret Check

# Read-only shape check of the Preview database secrets. One parse-only step
# runs the redacted classifier (scripts/classify-preview-db-url.mjs) on
# PREVIEW_POSTGRES_PRISMA_URL (the only database secret the Resume Build DEMO
# Acceptance lane reads, as POSTGRES_PRISMA_URL) and PREVIEW_DATABASE_URL. It
# uses the shared guard's projectForUrl and prints one JSON line per variable
# with only: name, classification (demo/prod/unknown), hostClass
# (direct/pooler/other), refPresent, pgbouncer and connectionLimit1. It never
# prints a host, ref, user, password, query or URL, opens no database
# connection, makes no network call, and exits non-zero unless both are DEMO.
# The secrets are exposed to that one step only. Nothing here touches the
# preview branch, the DEMO project or a provider. Run it after replacing a
# secret and before any acceptance dispatch: docs/RESUME-DEMO-ACCEPTANCE.md,
# "Replacing the Preview database secret".

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-db-secret-check
  cancel-in-progress: false

jobs:
  # UNGATED on purpose (no `if`), as in resume-demo-acceptance.yml: anything but
  # a master dispatch in the trusted repository is visibly red.
  policy:
    name: Require a master dispatch in the trusted repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Refuse anything but a workflow_dispatch on master
        env:
          RUN_REPOSITORY: ${{ github.repository }}
          RUN_REF: ${{ github.ref }}
          RUN_EVENT: ${{ github.event_name }}
        run: |
          if [ "$RUN_REPOSITORY" != "workforceap/workforceap-beta" ] || [ "$RUN_REF" != "refs/heads/master" ] || [ "$RUN_EVENT" != "workflow_dispatch" ]; then
            echo "::error::Preview DB Secret Check runs only as a workflow_dispatch on refs/heads/master of workforceap/workforceap-beta (got $RUN_EVENT on $RUN_REF in $RUN_REPOSITORY). Nothing else ran."
            exit 1
          fi
          echo "Trusted master dispatch."

  classify:
    name: Classify the Preview database secrets (no connection)
    needs: policy
    if: >-
      !cancelled() && needs.policy.result == 'success' &&
      github.repository == 'workforceap/workforceap-beta' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout trusted master
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      # Node built-ins only: no install, no network, no database client. The
      # secrets are step-scoped env vars named on the CLI's command line; no
      # step echoes them.
      - name: Classify without printing any value
        env:
          PREVIEW_POSTGRES_PRISMA_URL: ${{ secrets.PREVIEW_POSTGRES_PRISMA_URL }}
          PREVIEW_DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
        run: node scripts/classify-preview-db-url.mjs PREVIEW_POSTGRES_PRISMA_URL PREVIEW_DATABASE_URL
