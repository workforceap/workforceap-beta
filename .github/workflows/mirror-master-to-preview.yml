name: Mirror master to preview

# The trusted "Authenticated Portal Smoke" workflow refuses to sign in until its
# isolated preview target serves master's exact commit. Vercel only builds
# Preview deployments for non-production branches, so this workflow keeps a
# machine-owned `preview` branch pointed at master's head. `vercel.json` lets
# Vercel build that branch in its Preview environment, which is wired to the
# DEMO Supabase project (docs/STAGING_ENV.md), and the deployment's stable
# branch alias is what the PREVIEW_SITE_URL repository secret must hold.
#
# `preview` is a mirror, never a place to commit: every run of this workflow
# rewrites it to master's SHA. Nothing else may push to it.
#
# Triggers: manual dispatch, and `workflow_call` from Authenticated Portal Smoke
# (WAP-204), which refreshes the mirror before every non-production run, the
# nightly schedule included. The push trigger stays off (#2344): mirroring on
# every master merge built dozens of extra Preview deployments a day. The
# nightly call adds at most one Preview build a night, and none when `preview`
# already points at master.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: mirror-master-to-preview
  cancel-in-progress: true

jobs:
  mirror:
    name: Point preview at master
    if: github.repository == 'workforceap/workforceap-beta' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      MIRROR_BRANCH: preview

    steps:
      - name: Update refs/heads/preview to the trusted master SHA
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          sha="$GITHUB_SHA"
          ref_api="repos/$repo/git/ref/heads/$MIRROR_BRANCH"
          echo "master is at $sha"

          # Distinguish a genuine missing ref (HTTP 404 → create) from other
          # gh/API failures. Swallowing every non-zero exit and POSTing caused
          # 422 when the ref already existed but the GET hit a transient error.
          err="$(mktemp)"
          trap 'rm -f "$err"' EXIT

          if current="$(gh api "$ref_api" --jq '.object.sha' 2>"$err")"; then
            if [ "$current" = "$sha" ]; then
              echo "$MIRROR_BRANCH already points at $sha; nothing to do"
              exit 0
            fi
            echo "$MIRROR_BRANCH was at $current; moving it"
            gh api --method PATCH "repos/$repo/git/refs/heads/$MIRROR_BRANCH" \
              -f sha="$sha" -F force=true --jq '.object.sha'
          elif grep -qE '\(HTTP 404\)' "$err"; then
            echo "$MIRROR_BRANCH does not exist yet; creating it"
            gh api --method POST "repos/$repo/git/refs" \
              -f ref="refs/heads/$MIRROR_BRANCH" -f sha="$sha" --jq '.object.sha'
          else
            echo "::error::Failed to read refs/heads/$MIRROR_BRANCH; not creating (avoid POST 422 on transient GET failures):" >&2
            cat "$err" >&2
            exit 1
          fi
          echo "Vercel builds $MIRROR_BRANCH in its Preview environment; the Authenticated Portal Smoke gate waits for that deployment to report this SHA."
