overrides:
  fast-uri: '3.1.2'

allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@sentry/cli': true
  '@swc/core': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
patchedDependencies:
  # Next 15.5.18 vendors a React canary predating the hydration replay cursor
  # fix (facebook/react#35494). Remove after a Next release bundles that fix.
  next@15.5.18: patches/next@15.5.18.patch
